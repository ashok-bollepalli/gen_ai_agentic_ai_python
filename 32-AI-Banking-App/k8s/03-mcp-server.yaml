# MCP server: bank analytics tools (internal only -> ClusterIP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: bankbuddy
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      containers:
        - name: mcp-server
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/bankbuddy:1.0
          command: ["python", "-m", "app.mcp_server.server"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: bankbuddy-config }
            - secretRef:    { name: bankbuddy-secret }
          readinessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: bankbuddy
spec:
  type: ClusterIP
  selector: { app: mcp-server }
  ports:
    - port: 8001
      targetPort: 8001
