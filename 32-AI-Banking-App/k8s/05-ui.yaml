# Streamlit UI -> exposed to users through an AWS Load Balancer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: bankbuddy
spec:
  replicas: 2
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/bankbuddy:1.0
          command: ["streamlit", "run", "ui/app.py",
                    "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef: { name: bankbuddy-config, key: API_URL }
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: bankbuddy
  annotations:
    # AWS Network Load Balancer, internet facing
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP          # keep a user on the same Streamlit pod
  selector: { app: ui }
  ports:
    - port: 80
      targetPort: 8501
