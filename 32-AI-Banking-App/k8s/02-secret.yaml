# Secrets (DO NOT commit real values to Git)
# stringData = plain text here, Kubernetes stores it base64-encoded.
# Better for production: AWS Secrets Manager + External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: bankbuddy-secret
  namespace: bankbuddy
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxx"
  DB_USER: "admin"
  DB_PASSWORD: "your-rds-password"
