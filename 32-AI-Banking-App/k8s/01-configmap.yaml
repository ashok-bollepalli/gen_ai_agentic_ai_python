# Non-secret settings (safe to commit)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankbuddy-config
  namespace: bankbuddy
data:
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
  DB_HOST: "your-db.xxxxxxxx.ap-south-1.rds.amazonaws.com"   # <-- AWS RDS endpoint
  DB_PORT: "3306"
  DB_NAME: "bankdb"
  MCP_SERVER_URL: "http://mcp-service:8001/mcp"              # K8s service DNS
  API_URL: "http://api-service:8000"
  CHROMA_DIR: "/tmp/chroma_db"
  KNOWLEDGE_BASE_DIR: "/app/knowledge_base"
